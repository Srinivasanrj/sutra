[project]
name = "sutra-agent"
version = "0.1.0"
description = "Sutra: a terminal AI coding agent that runs on local LLMs (Ollama)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Srinivasan R", email = "srinivasanrj2006@gmail.com" }]
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
    "prompt-toolkit>=3.0",
    "python-dotenv>=1.0",
]

[project.scripts]
sutra = "sutra.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sutra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
